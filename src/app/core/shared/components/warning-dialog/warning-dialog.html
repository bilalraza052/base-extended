<div class="warning-dialog-container">

  <!-- Header: centered icon + top-right close -->
  <div class="warning-dialog-header">
    <div class="warning-icon-wrapper">
      <div class="warning-icon-ring">
        <svg class="warning-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
      </div>
    </div>
    <button mat-icon-button class="close-btn" (click)="cancel()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <mat-dialog-content class="warning-dialog-content">
    <h2 class="warning-title">{{ data.title }}</h2>
    <p class="warning-message">{{ data.message }}</p>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="warning-dialog-actions">
    <button mat-stroked-button class="no-btn" (click)="cancel()">
      {{ data.noText }}
    </button>
    <button mat-flat-button class="yes-btn" (click)="confirm()">
      {{ data.yesText }}
    </button>
  </mat-dialog-actions>

</div>
