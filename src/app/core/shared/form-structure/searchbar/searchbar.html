<div class="osl-searchbar-wrap" [class.osl-searchbar-wrap--focused]="focused">
  <svg class="osl-searchbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <input
    type="text"
    class="osl-searchbar-input"
    (keyup)="onKeyChange()"
    [formControl]="searchControl"
    [placeholder]="label"
    [(ngModel)]="searchQuery"
    (focus)="focused = true"
    (blur)="focused = false"
  />
  @if (searchQuery) {
    <button type="button" class="osl-searchbar-clear" tabindex="-1" aria-label="Clear search" (click)="clearSearch()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  }
</div>
