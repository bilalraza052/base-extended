<div class="d-flex flex-column">

    <label class="checkbox-wrapper"  [shSkeleton]="skeletonLoading" [shSkeletonTheme]="skeletonTheme" [class.checkbox-disabled]="disabled" [class.checkbox-invalid]="isInvalid">
        <input
            #checkboxEl
            type="checkbox"
            [ngModel]="model"
            (ngModelChange)="onModelChange($event)"
            [disabled]="disabled"
        >
        <span class="checkbox-label"  [shSkeleton]="skeletonLoading" [shSkeletonTheme]="skeletonTheme">
            <span class="label-text" [title]="label">{{label}}</span><span class="txt-clr-red label-required">{{required?'*':''}}</span>
        </span>
    </label>
    @if(isInvalid) {
        <mat-hint class="hint">Please complete this required field.</mat-hint>
    }
</div>
