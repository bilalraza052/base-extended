<div class="d-flex flex-column">
    @if (label) {
        <div [shSkeleton]="skeletonLoading" [shSkeletonTheme]="skeletonTheme">
            <label class="label" [class.txt-clr-red]="myField.touched && myField.invalid">
                <span class="label-text" [title]="label">{{label}}</span><span class="txt-clr-red label-required">{{required ? '*' : ''}}</span>
            </label>
        </div>
    }
    <div class="input-wrapper" [shSkeleton]="skeletonLoading" [shSkeletonTheme]="skeletonTheme"
         [class.error]="myField.touched && myField.invalid" [class.is-disabled]="disabled">
        <!-- HubSpot puts the calendar glyph on the left inside the field -->
        <button type="button" class="picker-icon" tabindex="-1" (click)="picker.open()" [disabled]="disabled" aria-label="Open calendar">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="12" height="11" rx="2"/>
                <line x1="2" y1="6.5" x2="14" y2="6.5"/>
                <line x1="5.2" y1="1.6" x2="5.2" y2="4.2"/>
                <line x1="10.8" y1="1.6" x2="10.8" y2="4.2"/>
            </svg>
        </button>
        <input
            class="date-input"
            [matDatepicker]="picker"
            [ngModel]="model"
            (dateChange)="onDateChange($event.value)"
            (click)="!disabled && picker.open()"
            [required]="required"
            [disabled]="disabled"
            [min]="minDateObj"
            [max]="maxDateObj"
            [placeholder]="placeholder || (dateType === 'year' ? 'YYYY' : 'MM/DD/YYYY')"
            autocomplete="off"
            #myField="ngModel"
        >
        @if (clearable && model && !disabled) {
            <button type="button" class="date-clear" tabindex="-1" (click)="onClear()" aria-label="Clear date">
                <svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2 2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
        }
        <mat-datepicker
            #picker
            panelClass="sh-datepicker-panel"
            [calendarHeaderComponent]="calendarHeader"
            [startView]="dateType === 'year' ? 'multi-year' : 'month'"
            (yearSelected)="dateType === 'year' && onYearSelected($event, picker)">
        </mat-datepicker>
    </div>
    @if (myField.touched && myField.invalid && required) {
        <mat-hint class="hint">Please complete this required field.</mat-hint>
    }
</div>
