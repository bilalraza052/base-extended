<div class="sh-modal">
  <header class="sh-modal__header">
    <h2 class="sh-modal__title">{{ data.title }}</h2>
  </header>
  <button type="button" class="sh-modal__close" (click)="close()" aria-label="Close">
    <svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>

  <mat-dialog-content class="sh-modal__body">
    <div class="ed-alert">
      <svg class="ed-alert__icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.6v4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".9" fill="currentColor"/></svg>
      <span>Please fix the following <strong>{{ data.errors.length }}</strong> {{ data.errors.length === 1 ? 'issue' : 'issues' }} before proceeding.</span>
    </div>
    <ul class="ed-list">
      @for (err of data.errors; track $index) {
        <li class="ed-item">{{ err }}</li>
      }
    </ul>
  </mat-dialog-content>

  <mat-dialog-actions class="sh-modal__footer">
    <button type="button" class="sh-modal__btn--primary" (click)="close()">Got it</button>
  </mat-dialog-actions>
</div>
